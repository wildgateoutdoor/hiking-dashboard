<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入野門活動管理</title>
<link rel="icon" type="image/png" href="favicon.png?v=3">
<link rel="shortcut icon" type="image/png" href="favicon.png?v=3">
<link rel="apple-touch-icon" href="favicon.png?v=3">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<style>
:root {
  --bg: #F2EEE5; --surface: #FFFFFF; --surface-hover: #EDE9E0; --surface-alt: #E8E4DA;
  --text: #253D33; --text-2: #4E6358; --text-muted: #8A9990;
  --border: #D4CFC4; --border-sub: #E2DED5;
  --accent: #3D8B66; --accent-hover: #357A59; --accent-bg: #E4F2EB; --accent-on: #FFF;
  --amber: #D4873A; --amber-bg: #FFF3E6; --amber-on: #7A4E1E;
  --red: #C24740; --red-bg: #FDECEA; --red-on: #7A2520;
  --warn: #C4960F; --warn-bg: #FFF8E0;
  --purple: #7B61A6; --purple-bg: #F0EBF7;
  --star: #D4873A; --star-off: #D0CABD;
  --shadow-sm: 0 1px 2px rgba(37,61,51,.06); --shadow: 0 1px 4px rgba(37,61,51,.09); --shadow-lg: 0 4px 16px rgba(37,61,51,.12);
  --r: 6px; --r-lg: 10px;
  --font: 'PingFang TC', 'Microsoft JhengHei', 'Microsoft JhengHei UI', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  --font-d: var(--font);
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]) {
    --bg: #141F1A; --surface: #1C2C24; --surface-hover: #24382D; --surface-alt: #182720;
    --text: #DEE4DF; --text-2: #9FAFA6; --text-muted: #637069;
    --border: #2B3D34; --border-sub: #223029;
    --accent: #52B07E; --accent-hover: #45A06F; --accent-bg: #1A3328; --accent-on: #FFF;
    --amber: #E49B50; --amber-bg: #32281A; --amber-on: #E49B50;
    --red: #E0605A; --red-bg: #321C1A; --red-on: #E0605A;
    --warn: #DAA820; --warn-bg: #322A14;
    --purple: #A48BCC; --purple-bg: #251E32;
    --star: #E49B50; --star-off: #3A4A42;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.2); --shadow: 0 1px 4px rgba(0,0,0,.28); --shadow-lg: 0 4px 16px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  --bg: #141F1A; --surface: #1C2C24; --surface-hover: #24382D; --surface-alt: #182720;
  --text: #DEE4DF; --text-2: #9FAFA6; --text-muted: #637069;
  --border: #2B3D34; --border-sub: #223029;
  --accent: #52B07E; --accent-hover: #45A06F; --accent-bg: #1A3328; --accent-on: #FFF;
  --amber: #E49B50; --amber-bg: #32281A; --amber-on: #E49B50;
  --red: #E0605A; --red-bg: #321C1A; --red-on: #E0605A;
  --warn: #DAA820; --warn-bg: #322A14;
  --purple: #A48BCC; --purple-bg: #251E32;
  --star: #E49B50; --star-off: #3A4A42;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.2); --shadow: 0 1px 4px rgba(0,0,0,.28); --shadow-lg: 0 4px 16px rgba(0,0,0,.35);
}

*,*::before,*::after{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:1120px;margin:0 auto;padding:28px 24px 60px}

.hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.hdr h1{font-family:var(--font-d);font-size:26px;font-weight:700;letter-spacing:-0.01em;color:var(--text);line-height:1.2}
.hdr-sub{font-size:13px;color:var(--text-muted);margin-top:2px}
.hdr-btns{display:flex;gap:8px}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.stat{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border:1px solid var(--border-sub);border-radius:var(--r);font-size:13px;font-weight:500;color:var(--text-2);box-shadow:var(--shadow-sm)}
.stat b{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.stat--accent b{color:var(--accent)}.stat--warn b{color:var(--warn)}.stat--red b{color:var(--red)}.stat--amber b{color:var(--amber)}

.view-tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:2px solid var(--border-sub);padding-bottom:0}
.vtab{padding:8px 16px;font:600 14px var(--font);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--text-muted);cursor:pointer;transition:all .15s}
.vtab:hover{color:var(--text-2)}.vtab.on{color:var(--accent);border-bottom-color:var(--accent)}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:20px;font-size:13px;font-weight:500;font-family:var(--font);border:1px solid var(--border);background:transparent;color:var(--text-2);cursor:pointer;transition:all .15s}
.chip:hover{background:var(--surface-hover)}.chip.on{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}

.date-filter{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);margin-bottom:16px}
.date-filter input{padding:4px 8px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);font:400 13px var(--font);color:var(--text)}
.date-filter span{color:var(--text-muted)}
.date-filter button{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:12px;text-decoration:underline;padding:0}
.date-filter button:hover{color:var(--text)}

.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:var(--r);font:600 14px var(--font);cursor:pointer;border:none;transition:all .15s}
.btn-p{background:var(--accent);color:var(--accent-on)}.btn-p:hover{background:var(--accent-hover)}
.btn-o{background:transparent;color:var(--text-2);border:1px solid var(--border)}.btn-o:hover{background:var(--surface-hover)}
.btn-g{background:transparent;color:var(--text-muted);border:none;padding:7px 12px}.btn-g:hover{color:var(--text)}
.btn-s{background:transparent;color:var(--text-muted);border:1px solid var(--border);padding:7px 10px}.btn-s:hover{background:var(--surface-hover);color:var(--text)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.tbl-wrap{overflow-x:auto;border:1px solid var(--border-sub);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
thead{background:var(--surface-alt)}
th{padding:10px 14px;font-size:12px;font-weight:600;color:var(--text-muted);text-align:left;text-transform:uppercase;letter-spacing:0.04em;border-bottom:1px solid var(--border-sub);white-space:nowrap;user-select:none}
th.sortable{cursor:pointer}th.sortable:hover{color:var(--text-2)}
th .arr{font-size:10px;margin-left:3px;opacity:.5}th.sorted .arr{opacity:1;color:var(--accent)}
td{padding:10px 14px;border-bottom:1px solid var(--border-sub);vertical-align:middle;font-size:14px}
tr:last-child td{border-bottom:none}tr:hover td{background:var(--surface-hover)}tr.past td{opacity:.45}

.stars{display:flex;gap:2px;cursor:pointer}
.stars svg{width:18px;height:18px;transition:transform .12s}.stars svg:hover{transform:scale(1.2)}
.star-on{color:var(--star)}.star-off{color:var(--star-off)}

.cap{white-space:nowrap}.cap-nums{font-weight:600;font-size:14px}.cap-full{color:var(--red)}.cap-high{color:var(--amber)}
.cap-bar{height:4px;background:var(--border-sub);border-radius:2px;margin-top:5px;min-width:80px;overflow:hidden}
.cap-fill{height:100%;border-radius:2px;transition:width .3s}

.reg-row{display:flex;align-items:center;gap:6px}
.reg-btn{width:24px;height:24px;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s;line-height:1;padding:0;font-family:var(--font)}
.reg-btn:hover{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
.reg-btn:disabled{opacity:.3;cursor:default}.reg-btn:disabled:hover{background:var(--surface);border-color:var(--border);color:var(--text-2)}

.pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.pill-open{background:var(--accent-bg);color:var(--accent)}.pill-soon{background:var(--warn-bg);color:var(--warn)}
.pill-today{background:var(--red-bg);color:var(--red);animation:pulse 1.5s ease infinite}
.pill-closed{background:var(--surface-alt);color:var(--text-muted)}.pill-full{background:var(--red-bg);color:var(--red)}
.pill-done{background:var(--surface-alt);color:var(--text-muted)}
.pill-none{background:var(--accent-bg);color:var(--accent)}.pill-apply{background:var(--amber-bg);color:var(--amber)}
.pill-waiting{background:var(--purple-bg);color:var(--purple)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

.cd{font-weight:600;font-size:14px;white-space:nowrap}
.cd-ok{color:var(--accent)}.cd-soon{color:var(--warn)}.cd-urgent{color:var(--red)}.cd-past{color:var(--text-muted)}

.status-select-wrap{position:relative;display:inline-flex}
.status-select-wrap::before{content:'';position:absolute;right:22px;top:50%;transform:translateY(-50%);width:1px;height:12px;background:var(--border)}
.status-select-wrap::after{content:'';position:absolute;right:9px;top:50%;transform:translateY(-30%);width:0;height:0;border-left:3.5px solid transparent;border-right:3.5px solid transparent;border-top:4.5px solid var(--text-muted);pointer-events:none}
select.pill{appearance:none;-webkit-appearance:none;-moz-appearance:none;outline:none;cursor:pointer;font:600 12px var(--font);padding:3px 30px 3px 12px;border:none;line-height:1.5}
select.pill.pill-open{background:var(--accent-bg);color:var(--accent)}
select.pill.pill-apply{background:var(--amber-bg);color:var(--amber)}
select.pill.pill-full{background:var(--red-bg);color:var(--red)}
select.pill.pill-waiting{background:var(--purple-bg);color:var(--purple)}
select.pill.pill-done{background:var(--surface-alt);color:var(--text-muted)}

.acts{display:flex;gap:4px}
.act-btn{width:30px;height:30px;border-radius:var(--r);border:none;background:transparent;color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s}
.act-btn:hover{background:var(--surface-alt);color:var(--text)}.act-btn.del:hover{background:var(--red-bg);color:var(--red)}
.act-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.act-btn.expand svg{transition:transform .15s}
.act-btn.expand.open svg{transform:rotate(90deg)}

tr.detail-row td{background:var(--surface);padding:0;border:none}
tr.detail-row:hover td{background:var(--surface)}
tr.detail-row td.dr-line{border-top:1px dashed var(--border-sub)}
tr.detail-row td.dr-body{padding:14px 18px 16px;border-top:1px dashed var(--border-sub)}
.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px 24px;font-size:13px}
.detail-item b{display:block;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.detail-item a{color:var(--accent)}
.detail-item span{color:var(--text-2)}

.empty{padding:60px 20px;text-align:center;color:var(--text-muted)}
.empty svg{width:64px;height:64px;color:var(--border);margin-bottom:16px}.empty p{font-size:15px;margin-bottom:16px}

/* Calendar */
.cal-wrap{border:1px solid var(--border-sub);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface-alt);border-bottom:1px solid var(--border-sub)}
.cal-nav h3{font-size:16px;font-weight:700}
.cal-nav button{width:32px;height:32px;border-radius:50%;border:none;background:transparent;color:var(--text-2);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font)}
.cal-nav button:hover{background:var(--surface-hover)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr)}
.cal-dow{padding:8px 4px;text-align:center;font-size:11px;font-weight:600;color:var(--text-muted);border-bottom:1px solid var(--border-sub)}
.cal-day{min-height:90px;padding:6px 8px;border-bottom:1px solid var(--border-sub);border-right:1px solid var(--border-sub);cursor:pointer;transition:background .12s;position:relative}
.cal-day:nth-child(7n){border-right:none}
.cal-day:hover{background:var(--surface-hover)}.cal-day.other{opacity:.35}.cal-day.today{background:var(--accent-bg)}
.cal-num{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;margin-bottom:4px}
.cal-today-num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-on);margin:-2px}
.cal-ev{font-size:11px;line-height:1.4;padding:2px 5px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.cal-ev-trip{background:var(--accent-bg);color:var(--accent)}
.cal-ev-dead{background:var(--red-bg);color:var(--red)}
.cal-ev-promo{background:var(--purple-bg);color:var(--purple)}
.cal-ev-apply{background:var(--amber-bg);color:var(--amber)}
.cal-more{font-size:10px;color:var(--text-muted);padding:0 5px;cursor:pointer}.cal-more:hover{color:var(--accent)}
.cal-popup{position:fixed;z-index:90;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:12px 16px;min-width:220px;max-width:320px}
.cal-popup h4{font-size:14px;font-weight:700;margin-bottom:8px}
.cal-popup-item{font-size:13px;padding:4px 0;border-bottom:1px solid var(--border-sub);display:flex;gap:6px;align-items:baseline}
.cal-popup-item:last-child{border-bottom:none}
.cal-popup-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}

/* Marketing overview (list view) */
.mktgview-month{margin-bottom:22px}
.mktgview-month h3{font-family:var(--font-d);font-size:16px;font-weight:700;color:var(--text);margin-bottom:10px}
.mktgview-list{list-style:none}
.mktgview-list li{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border:1px solid var(--border-sub);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-sm);margin-bottom:8px;flex-wrap:wrap}
.mktgview-list li::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--purple);flex-shrink:0;margin-top:6px}
.mktgview-list li b{font-size:14px;font-weight:600;color:var(--text)}
.mktgview-list li span{font-size:13px;color:var(--text-2)}

/* Marketing */
.mktg{margin-bottom:20px}
.mktg-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mktg-header h2{font-size:16px;font-weight:700}
.mktg-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.mktg-card{padding:14px 16px;border:1px solid var(--border-sub);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow-sm)}
.mktg-card-name{font-weight:600;font-size:14px;margin-bottom:4px}
.mktg-card-date{font-size:12px;color:var(--text-2);margin-bottom:8px}
.mktg-card-actions{display:flex;flex-direction:column;gap:4px}
.mktg-action{display:flex;align-items:center;gap:6px;font-size:12px;padding:4px 8px;border-radius:4px}
.mktg-action-promo{background:var(--purple-bg);color:var(--purple)}
.mktg-action-apply{background:var(--amber-bg);color:var(--amber)}
.mktg-action-done{background:var(--accent-bg);color:var(--accent)}
.mktg-action-urgent{background:var(--red-bg);color:var(--red)}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(37,61,51,.35);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:all .2s}
.overlay.show{opacity:1;visibility:visible}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;transform:translateY(12px);transition:transform .2s}
.overlay.show .modal{transform:translateY(0)}
.modal.lg{max-width:620px}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border-sub)}
.modal-h h2{font-size:17px;font-weight:700}
.close-btn{width:30px;height:30px;border-radius:50%;border:none;background:transparent;color:var(--text-muted);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--font)}
.close-btn:hover{background:var(--surface-alt);color:var(--text)}
.modal-body{padding:22px}
.f-row{margin-bottom:16px}
.f-row label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.f-row input,.f-row textarea,.f-row select{width:100%;padding:8px 12px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg);font:400 14px var(--font);color:var(--text);transition:border-color .15s}
.f-row select{appearance:auto}
.f-row input:focus,.f-row textarea:focus,.f-row select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.f-row textarea{resize:vertical;min-height:60px}
.f-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.f-triple{display:grid;grid-template-columns:1fr 1fr 2fr;gap:14px}
.f-actions{display:flex;justify-content:flex-end;gap:10px;padding-top:8px}

/* Settings tabs */
.stab-row{display:flex;gap:0;border-bottom:2px solid var(--border-sub);margin-bottom:16px;overflow-x:auto}
.stab{padding:8px 14px;font:600 13px var(--font);background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--text-muted);cursor:pointer;transition:all .15s;white-space:nowrap}
.stab:hover{color:var(--text-2)}.stab.on{color:var(--accent);border-bottom-color:var(--accent)}
.stab-panel{display:none}.stab-panel.on{display:block}

.deadline-hint{font-size:12px;margin-top:4px;padding:4px 8px;background:var(--accent-bg);color:var(--accent);border-radius:4px;display:none}
.deadline-hint.show{display:block}
.apply-hint{font-size:12px;margin-top:4px;padding:4px 8px;background:var(--amber-bg);color:var(--amber);border-radius:4px;display:none}
.apply-hint.show{display:block}

.rule-list{margin-bottom:20px}
.rule-item{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--border-sub);border-radius:var(--r);margin-bottom:8px;background:var(--bg)}
.rule-info{flex:1;min-width:0}.rule-label{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px}
.rule-names{display:flex;flex-wrap:wrap;gap:4px}
.rule-tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--surface);border:1px solid var(--border-sub);color:var(--text-2)}
.rule-acts{display:flex;gap:2px;flex-shrink:0}
.rule-edit-form{display:flex;flex-direction:column;gap:10px;width:100%}
.rule-edit-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.rule-edit-row .f-row{margin-bottom:0;flex:1;min-width:80px}
.rule-edit-row .f-row label{font-size:12px}
.rule-edit-row .f-row input,.rule-edit-row .f-row select{padding:6px 10px;font-size:13px}
.rule-edit-btns{display:flex;gap:6px;justify-content:flex-end;margin-top:4px}
.rule-empty{text-align:center;padding:20px;color:var(--text-muted);font-size:14px}
.rule-divider{border:none;border-top:1px solid var(--border-sub);margin:20px 0 16px}

.rpt-pre{background:var(--bg);border:1px solid var(--border-sub);border-radius:var(--r);padding:16px;margin-bottom:16px;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all;max-height:380px;overflow-y:auto;font-family:var(--font)}
.rpt-actions{display:flex;gap:10px;flex-wrap:wrap}
.rpt-note{margin-top:16px;padding:12px 14px;background:var(--accent-bg);border-radius:var(--r);font-size:13px;color:var(--text-2);line-height:1.6}

  {key:'waiting',label:'等待出團',cls:'pill-waiting'},

  {id:'r1',months:0,days:7,names:['合歡群峰','戒茂斯上嘉明湖','高島縱走','加里山','水漾森林']},

  {id:'a2',months:0,days:5,names:['郡大山']},

];

const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5Z3hvY2hvd2JobWRmdHN0Z296Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMzc4MjcsImV4cCI6MjEwMzkxMzgyN30.EVgYdDb4lxsj3Rb40uCZHt2x_6tyexGuVTVywjj2fHQ';

function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function parseD(s){return new Date(s+'T00:00:00')}
function fmtDate(s){const d=parseD(s);return`${d.getMonth()+1}/${d.getDate()}（${DAYS[d.getDay()]}）`}
function fmtShort(s){const d=parseD(s);return`${d.getMonth()+1}/${d.getDate()}`}
function daysUntil(s){return Math.ceil((parseD(s)-today())/864e5)}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function dateStr(d){return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function escAttr(s){return esc(s).replace(/"/g,'&quot;')}
function fmtRange(s,e){
  if(!e||s===e)return fmtDate(s);
  const ds=parseD(s),de=parseD(e);
  if(ds.getMonth()===de.getMonth())return`${ds.getMonth()+1}/${ds.getDate()}~${de.getDate()}（${DAYS[ds.getDay()]}~${DAYS[de.getDay()]}）`;
  return`${fmtShort(s)}~${fmtShort(e)}`;
}

// ── Rules: load / save / match / label ──
const LS_TO_SETTINGS={'hk-rules':'deadlineRules','hk-apply':'applyRules','hk-mktg':'mktgRules'};
function localGet(key,def){try{const s=localStorage.getItem(key);if(s)return JSON.parse(s)}catch{}return JSON.parse(JSON.stringify(def))}
function saveToLS(key,data){
  try{localStorage.setItem(key,JSON.stringify(data))}catch{}
  const sk=LS_TO_SETTINGS[key];
  if(sk&&sb){sb.from('settings').upsert({key:sk,data}).then(({error})=>{if(error)console.error('settings save',error)})}
}

async function loadAllRules(){
  let m={};
  if(sb){
    try{const{data,error}=await sb.from('settings').select('*');if(!error&&data)data.forEach(r=>m[r.key]=r.data)}catch(e){console.error(e)}
  }
  deadlineRules=m.deadlineRules||localGet('hk-rules',DEF_DEADLINE);
  applyRules=m.applyRules||localGet('hk-apply',DEF_APPLY);
  mktgRules=m.mktgRules||localGet('hk-mktg',DEF_MKTG);

    if(!m.applyRules)saveToLS('hk-apply',applyRules);
    if(!m.mktgRules)saveToLS('hk-mktg',mktgRules);
  }
  rulesReady=true;
}

function matchRuleIn(rules,name){
  if(!name)return null;const n=name.trim();
  for(const r of rules)for(const rn of r.names)if(n.includes(rn)||rn.includes(n))return r;
  return null;
}

  if(r.months<0)return'免申請';
  let p=[];if(r.months>0)p.push(`${r.months} 個月`);if(r.days>0)p.push(`${r.days} 天`);
  return p.length===0?'出發前申請':'提前 '+p.join('又 ')+' 申請';
}
function mktgLabel(r){return`提前 ${r.promoMonths} 個月宣傳`}

function calcDateBefore(tripDate,months,days){
  const d=parseD(tripDate);d.setMonth(d.getMonth()-(months||0));d.setDate(d.getDate()-(days||0));return d;
}

// state: 'unset' (no matching rule), 'none' (免申請), 'dated' (has a computed apply deadline)
function applyInfo(t){
  const ar=matchRuleIn(applyRules,t.name);
  if(!ar)return{state:'unset'};
  if(ar.months<0)return{state:'none'};
  const d=calcDateBefore(t.date,ar.months,ar.days);
  return{state:'dated',date:d,ds:dateStr(d),days:Math.ceil((d-today())/864e5)};
}

// ── Auto-fill in trip form ──
function tryAutoFill(){
  const name=document.getElementById('f-name').value;
  const tripDate=document.getElementById('f-date').value;
  const deadEl=document.getElementById('f-dead');
  const hintEl=document.getElementById('deadline-hint');
  const applyHintEl=document.getElementById('apply-hint');

  const dr=matchRuleIn(deadlineRules,name);
  if(dr&&tripDate){
    const dl=calcDateBefore(tripDate,dr.months,dr.days);
    deadEl.value=dateStr(dl);
    hintEl.textContent='根據規則自動設定：'+deadlineLabel(dr);hintEl.classList.add('show');
  }else{hintEl.classList.remove('show')}

  const ar=matchRuleIn(applyRules,name);
  if(ar&&tripDate){
    if(ar.months<0){applyHintEl.textContent='此路線免申請';applyHintEl.classList.add('show')}
    else{const ad=calcDateBefore(tripDate,ar.months,ar.days);applyHintEl.textContent='申請截止：'+fmtDate(dateStr(ad))+'（'+applyLabel(ar)+'）';applyHintEl.classList.add('show')}
  }else{applyHintEl.classList.remove('show')}
}

// ── Marketing priorities ──
function getMarketingItems(){
  const now=today();const items=[];
  const future=trips.filter(t=>daysUntil(t.date)>=0);
  for(const t of future){
    const mr=matchRuleIn(mktgRules,t.name);
    const ar=matchRuleIn(applyRules,t.name);
    if(!mr&&!ar)continue;
    let inPromo=false,promoStart=null;
    if(mr){promoStart=calcDateBefore(t.date,mr.promoMonths,0);inPromo=now>=promoStart&&now<=parseD(t.date)}
    let applyDeadline=null,applyDaysLeft=null,noApply=false;
    if(ar){
      if(ar.months<0){noApply=true}
      else{applyDeadline=calcDateBefore(t.date,ar.months,ar.days);applyDaysLeft=Math.ceil((applyDeadline-now)/864e5)}
    }
    if(!inPromo&&(!applyDeadline||applyDaysLeft<-7))continue;
    items.push({trip:t,inPromo,applyDeadline,applyDaysLeft,noApply});
  }
  items.sort((a,b)=>{
    if(a.applyDeadline&&b.applyDeadline)return a.applyDeadline-b.applyDeadline;
    if(a.applyDeadline)return-1;if(b.applyDeadline)return 1;
    return parseD(a.trip.date)-parseD(b.trip.date);
  });
  return items;
}

function renderMktg(){
  const sec=document.getElementById('mktg-section');
  const items=getMarketingItems();
  if(items.length===0){sec.innerHTML='';return}
  let html=`<div class="mktg-header"><h2>本週行銷重點</h2></div><div class="mktg-cards">`;
  for(const it of items){
    const dateRange=it.trip.dateEnd?`${fmtShort(it.trip.date)}~${fmtShort(it.trip.dateEnd)}`:`${fmtDate(it.trip.date)}`;
    html+=`<div class="mktg-card"><div class="mktg-card-name">${esc(it.trip.name)}</div>`;
    html+=`<div class="mktg-card-date">${dateRange} 出發｜${it.trip.registered}/${it.trip.capacity} 人</div>`;
    html+=`<div class="mktg-card-actions">`;
    if(it.inPromo){const d=daysUntil(it.trip.date);html+=`<div class="mktg-action mktg-action-promo">📣 宣傳中（出發前 ${d} 天）</div>`}
    if(it.noApply){html+=`<div class="mktg-action mktg-action-done">✓ 免申請</div>`}
    else if(it.applyDeadline){
      if(it.applyDaysLeft<0)html+=`<div class="mktg-action mktg-action-done">✓ 已過申請期限</div>`;
      else if(it.applyDaysLeft<=7)html+=`<div class="mktg-action mktg-action-urgent">⚠ 需申請（剩 ${it.applyDaysLeft} 天，${fmtShort(dateStr(it.applyDeadline))} 前）</div>`;
      else html+=`<div class="mktg-action mktg-action-apply">📋 ${fmtShort(dateStr(it.applyDeadline))} 前申請</div>`;
    }
    html+=`</div></div>`;
  }
  sec.innerHTML=html+`</div>`;
}

// ── Marketing overview (list view) ──
function getAllMktgPeriods(){
  const items=[];
  for(const t of trips){
    if(daysUntil(t.date)<0)continue;
    const mr=matchRuleIn(mktgRules,t.name);
    if(!mr)continue;
    const start=calcDateBefore(t.date,mr.promoMonths,0);
    items.push({trip:t,start,end:parseD(t.deadline)});
  }
  items.sort((a,b)=>a.start-b.start);
  return items;
}
function renderMktgView(){
  const el=document.getElementById('mktgview-body');
  const items=getAllMktgPeriods();
  if(items.length===0){el.innerHTML='<div class="empty"><p>目前沒有排定宣傳的活動</p></div>';return}
  const groups=[];
  for(const it of items){
    const key=`${it.start.getFullYear()}年${it.start.getMonth()+1}月`;
    let g=groups.find(x=>x.key===key);
    if(!g){g={key,items:[]};groups.push(g)}
    g.items.push(it);
  }
  let html='';
  for(const g of groups){
    html+=`<div class="mktgview-month"><h3>${g.key}</h3><ul class="mktgview-list">`;
    for(const it of g.items){
      html+=`<li><b>${esc(it.trip.name)}</b><span>${fmtShort(dateStr(it.start))}（開始宣傳）～${fmtShort(it.trip.deadline)}（報名截止）</span></li>`;
    }
    html+='</ul></div>';
  }
  el.innerHTML=html;
}

// ── Calendar ──
function initCal(){const n=today();calYear=n.getFullYear();calMonth=n.getMonth()}
function calPrev(){calMonth--;if(calMonth<0){calMonth=11;calYear--}renderCal()}
function calNext(){calMonth++;if(calMonth>11){calMonth=0;calYear++}renderCal()}

function getEventsForDate(ds){
  const events=[];
  for(const t of trips){
    if(t.date===ds)events.push({type:'trip',label:t.name});
    if(t.dateEnd&&t.dateEnd===ds&&t.dateEnd!==t.date)events.push({type:'trip',label:'回程：'+t.name});
    if(t.deadline===ds)events.push({type:'deadline',label:'截止：'+t.name});
  }
  for(const t of trips){
    if(daysUntil(t.date)<0)continue;
    const mr=matchRuleIn(mktgRules,t.name);
    if(mr){const ps=calcDateBefore(t.date,mr.promoMonths,0);if(dateStr(ps)===ds)events.push({type:'promo',label:'開始宣傳：'+t.name})}
    const ar=matchRuleIn(applyRules,t.name);
    if(ar&&ar.months>=0){const ad=calcDateBefore(t.date,ar.months,ar.days);if(dateStr(ad)===ds)events.push({type:'apply',label:'申請截止：'+t.name})}
  }
  return events;
}

function renderCal(){
  document.getElementById('cal-title').textContent=`${calYear}年${calMonth+1}月`;
  const grid=document.getElementById('cal-grid');
  const dows=['一','二','三','四','五','六','日'];
  let html=dows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  const first=new Date(calYear,calMonth,1);
  let startDow=first.getDay()-1;if(startDow<0)startDow=6;
  const dim=new Date(calYear,calMonth+1,0).getDate();
  const prevDim=new Date(calYear,calMonth,0).getDate();
  const todayStr=dateStr(today());

  for(let i=0;i<startDow;i++){
    const d=prevDim-startDow+1+i;const pm=calMonth===0?12:calMonth;const py=calMonth===0?calYear-1:calYear;
    const ds=`${py}-${String(pm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    html+=`<div class="cal-day other" onclick="showDayPopup(event,'${ds}')"><div class="cal-num">${d}</div>${renderCalEvs(getEventsForDate(ds))}</div>`;
  }
  for(let d=1;d<=dim;d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=ds===todayStr;
    const evs=getEventsForDate(ds);
    const numH=isToday?`<span class="cal-today-num">${d}</span>`:`${d}`;
    html+=`<div class="cal-day${isToday?' today':''}" onclick="showDayPopup(event,'${ds}')"><div class="cal-num">${numH}</div>${renderCalEvs(evs)}</div>`;
  }
  const rem=(7-(startDow+dim)%7)%7;
  for(let i=1;i<=rem;i++){
    const nm=calMonth===11?1:calMonth+2;const ny=calMonth===11?calYear+1:calYear;
    const ds=`${ny}-${String(nm).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
    html+=`<div class="cal-day other" onclick="showDayPopup(event,'${ds}')"><div class="cal-num">${i}</div>${renderCalEvs(getEventsForDate(ds))}</div>`;
  }
  grid.innerHTML=html;
}

function renderCalEvs(evs){
  let html='';const max=3;
  for(let i=0;i<Math.min(evs.length,max);i++){
    const cls=evs[i].type==='trip'?'cal-ev-trip':evs[i].type==='deadline'?'cal-ev-dead':evs[i].type==='promo'?'cal-ev-promo':'cal-ev-apply';
    html+=`<div class="cal-ev ${cls}">${esc(evs[i].label)}</div>`;
  }
  if(evs.length>max)html+=`<div class="cal-more">+${evs.length-max} 更多</div>`;
  return html;
}

function showDayPopup(evt,ds){
  evt.stopPropagation();const evs=getEventsForDate(ds);const popup=document.getElementById('cal-popup');
  if(evs.length===0){popup.style.display='none';return}
  const d=parseD(ds);
  const dotC={trip:'var(--accent)',deadline:'var(--red)',promo:'var(--purple)',apply:'var(--amber)'};
  let html=`<h4>${d.getMonth()+1}/${d.getDate()}（${DAYS[d.getDay()]}）</h4>`;
  evs.forEach(e=>{html+=`<div class="cal-popup-item"><div class="cal-popup-dot" style="background:${dotC[e.type]}"></div><span>${esc(e.label)}</span></div>`});
  popup.innerHTML=html;popup.style.display='block';
  const r=evt.currentTarget.getBoundingClientRect();
  let left=r.right+8,top=r.top;
  if(left+320>window.innerWidth)left=r.left-328;
  if(top+200>window.innerHeight)top=window.innerHeight-220;
  if(left<0)left=8;if(top<0)top=8;
  popup.style.left=left+'px';popup.style.top=top+'px';
}

async function startEditRule(id,type){if(!await ensureEditor())return;editingRuleId=id;renderAllRuleLists()}

function saveEditRule(id,type){
  const m=parseInt(document.getElementById('re-months').value);
  const ns=document.getElementById('re-names').value.trim();
  if(!ns){toast('請輸入路線名稱');return}
  const names=ns.split(/[,，、]/).map(s=>s.trim()).filter(Boolean);
  if(type==='deadline'){
    const d=parseInt(document.getElementById('re-days').value)||0;
    if(m===0&&d===0){toast('請設定提前時間');return}
    const r=deadlineRules.find(x=>x.id===id);if(r){r.months=m;r.days=d;r.names=names}
    saveToLS('hk-rules',deadlineRules);
  }else if(type==='apply'){
    const d=parseInt(document.getElementById('re-days').value)||0;
    const r=applyRules.find(x=>x.id===id);if(r){r.months=m;r.days=d;r.names=names}
    saveToLS('hk-apply',applyRules);
  }else{
    const r=mktgRules.find(x=>x.id===id);if(r){r.promoMonths=m||1;r.names=names}
    saveToLS('hk-mktg',mktgRules);
  }
  editingRuleId=null;renderAllRuleLists();toast('規則已更新');
}

async function delRule(id,type){

  else{mktgRules=mktgRules.filter(r=>r.id!==id);saveToLS('hk-mktg',mktgRules)}

// ── Storage layer ──
// 本機備援（Supabase 無法載入時仍可用，資料只存這台電腦）
const LocalStore={
  add(t){trips.push(t);this._save();render()},
  upd(id,f){const t=trips.find(x=>x.id===id);if(t)Object.assign(t,f);this._save();render()},
  del(id){trips=trips.filter(x=>x.id!==id);this._save();render()},
  _save(){try{localStorage.setItem('hk-trips',JSON.stringify(trips))}catch{}}
};

// Supabase 共用資料庫
const SupaStore={
  add(t){trips.push(t);render();sb.from('trips').insert({id:t.id,data:t}).then(({error})=>{if(error)toast('儲存失敗：'+error.message)})},
  upd(id,f){const t=trips.find(x=>x.id===id);if(!t)return;Object.assign(t,f);render();sb.from('trips').update({data:t,updated_at:new Date().toISOString()}).eq('id',id).then(({error})=>{if(error)toast('儲存失敗：'+error.message)})},
  del(id){trips=trips.filter(x=>x.id!==id);render();sb.from('trips').delete().eq('id',id).then(({error})=>{if(error)toast('刪除失敗：'+error.message)})}
};

async function loadTrips(){
  if(!sb)return;
  const{data,error}=await sb.from('trips').select('*');
  if(error){console.error('load trips',error);toast('讀取資料失敗');return}
  trips=(data||[]).map(r=>({id:r.id,...r.data}));
  render();
}

async function initDB(){
  // 建立 Supabase 連線
  try{if(window.supabase)sb=window.supabase.createClient(SB_URL,SB_KEY)}catch(e){console.error(e)}
  if(sb){
    store=SupaStore;
    await loadAllRules();
    await loadTrips();
    // 即時同步：任何人改動 → 重新讀取
    sb.channel('trips-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'trips'},()=>loadTrips())
      .on('postgres_changes',{event:'*',schema:'public',table:'settings'},()=>loadAllRules().then(render))
      .subscribe();
    maybeMigrateLocal();
  }else{
    // 連不上 Supabase → 退回本機模式
    store=LocalStore;
    trips=localGet('hk-trips',[]);
    await loadAllRules();
    render();
    toast('雲端連線失敗，暫時使用本機資料');
  }
}

// 首次接上雲端時，把這台電腦 localStorage 的舊活動搬上去
async function maybeMigrateLocal(){
  let local=[];try{local=JSON.parse(localStorage.getItem('hk-trips')||'[]')}catch{}
  if(trips.length>0||local.length===0)return;
  if(!confirm(`偵測到這台電腦有 ${local.length} 筆本機舊資料，雲端目前是空的。\n要上傳到雲端，讓大家都看得到嗎？`))return;
  for(const t of local){await sb.from('trips').insert({id:t.id,data:t})}
  toast(`已上傳 ${local.length} 筆資料到雲端`);
  loadTrips();
}

// ── 登入驗證 ──
async function sha256hex(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
// 已登入即可編輯，所有寫入動作沿用此檢查（登入後恆為 true）
async function ensureEditor(){return true}
async function tryLogin(){
  const el=document.getElementById('login-pw');const err=document.getElementById('login-err');
  const pw=el.value;
  if(!pw){err.textContent='請輸入密碼';return}
  let h;
  try{h=await sha256hex(pw)}
  catch(e){err.textContent='此瀏覽器無法驗證，請用 Chrome/Safari 並確認網址是 https';return}
  if(h===EDIT_PW_HASH){try{localStorage.setItem('hk-auth','1')}catch{}enterApp()}
  else{err.textContent='密碼錯誤';el.select()}
}
let appStarted=false;
function enterApp(){
  const g=document.getElementById('login-gate');if(g)g.hidden=true;
  if(appStarted)return;appStarted=true;
  initCal();render();initDB();
}
function logout(){try{localStorage.removeItem('hk-auth')}catch{}location.reload()}

// ── Render ──
function filtered(){
  let list=[...trips];
  if(filter==='promo')list=list.filter(t=>t.promoted>0);
  else if(filter==='soon')list=list.filter(t=>{const d=daysUntil(t.deadline);return d>=0&&d<=7});
  else if(filter==='almost')list=list.filter(t=>t.capacity>0&&t.registered/t.capacity>=0.8);
  if(dateFrom)list=list.filter(t=>t.date>=dateFrom);
  if(dateTo)list=list.filter(t=>t.date<=dateTo);
  return list;
}
function setDateFilter(){
  dateFrom=document.getElementById('df-from').value||null;
  dateTo=document.getElementById('df-to').value||null;
  render();
}
function clearDateFilter(){
  document.getElementById('df-from').value='';document.getElementById('df-to').value='';
  dateFrom=null;dateTo=null;render();
}
function sorted(list){
  const m=sortDir==='asc'?1:-1;
  return list.sort((a,b)=>{
    let va,vb;
    if(sortKey==='promoted'){va=a.promoted||0;vb=b.promoted||0}
    else if(sortKey==='name'){va=a.name;vb=b.name}
    else if(sortKey==='date'){va=a.date;vb=b.date}
    else if(sortKey==='_applyDead'){const ia=applyInfo(a),ib=applyInfo(b);va=ia.state==='dated'?ia.date.getTime():ia.state==='none'?-Infinity:Infinity;vb=ib.state==='dated'?ib.date.getTime():ib.state==='none'?-Infinity:Infinity}
    else if(sortKey==='_cd'){const ia=applyInfo(a),ib=applyInfo(b);va=ia.state==='dated'?ia.days:ia.state==='none'?-Infinity:Infinity;vb=ib.state==='dated'?ib.days:ib.state==='none'?-Infinity:Infinity}
    else if(sortKey==='_cap'){va=a.capacity?a.registered/a.capacity:0;vb=b.capacity?b.registered/b.capacity:0}
    else{va=a.date;vb=b.date}
    return va<vb?-1*m:va>vb?1*m:0;
  });
}

function render(){
  const now=new Date();
  document.getElementById('date-line').textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日（${DAYS[now.getDay()]}）`;
  const future=trips.filter(t=>daysUntil(t.date)>=0);
  document.getElementById('s-total').textContent=future.length;
  document.getElementById('s-soon').textContent=future.filter(t=>{const d=daysUntil(t.deadline);return d>=0&&d<=7}).length;
  document.getElementById('s-full').textContent=future.filter(t=>t.capacity>0&&t.registered/t.capacity>=0.8).length;
  document.getElementById('s-promo').textContent=future.filter(t=>t.promoted>0).length;

  renderMktg();
  if(viewMode==='calendar')renderCal();
  if(viewMode==='mktgview')renderMktgView();

  document.getElementById('filters').innerHTML=FILTERS.map(f=>`<button class="chip${filter===f.key?' on':''}" onclick="setFilter('${f.key}')">${f.label}</button>`).join('');

  document.getElementById('thead-row').innerHTML=COLS.map(c=>{
    if(!c.sort)return`<th>${c.label}</th>`;
    const active=sortKey===c.key;const arr=active?(sortDir==='asc'?'▲':'▼'):'▲';
    return`<th class="sortable${active?' sorted':''}" onclick="setSort('${c.key}')">${c.label}<span class="arr">${arr}</span></th>`;
  }).join('');

  const list=sorted(filtered());const tb=document.getElementById('tbody');const emp=document.getElementById('empty');
  if(list.length===0){tb.innerHTML='';emp.hidden=false;return}
  emp.hidden=true;

  tb.innerHTML=list.map(t=>{
    const isPast=daysUntil(t.date)<0;
    const pct=t.capacity>0?Math.min(t.registered/t.capacity,1):0;
    const isFull=t.capacity>0&&t.registered>=t.capacity;

    const promoOn=(t.promoted||0)>0;
    const flagsH=`<div class="stars"><svg class="${promoOn?'star-on':'star-off'}" viewBox="0 0 20 20" onclick="event.stopPropagation();toggleStar('${t.id}')" title="重點宣傳"><path d="M10 1.5l2.18 4.41 4.87.71-3.52 3.44.83 4.85L10 12.67 5.64 14.91l.83-4.85L2.95 6.62l4.87-.71z" fill="currentColor"/></svg></div>`;

    const ai=applyInfo(t);
    let applyDeadH,applyCdH,applyCdC,applyStatH;
    const applied=Math.min(t.applied||0,t.registered||0);
    if(isPast){
      applyDeadH='—';applyCdH='已結束';applyCdC='cd-past';applyStatH='<span class="pill pill-done">已結束</span>';
    }else if(ai.state==='unset'){
      applyDeadH='<span style="color:var(--text-muted)">未設定</span>';applyCdH='—';applyCdC='cd-past';
      applyStatH='<span class="pill pill-closed">未設定</span>';
    }else if(ai.state==='none'){
      applyDeadH='<span style="color:var(--text-muted)">免申請</span>';applyCdH='免申請';applyCdC='cd-ok';
      applyStatH='<span class="pill pill-none">免申請</span>';
    }else{
      applyDeadH=fmtDate(ai.ds);
      const d=ai.days;
      if(d<0){applyCdH='已截止';applyCdC='cd-past'}
      else if(d===0){applyCdH='今天截止';applyCdC='cd-urgent'}
      else if(d<=3){applyCdH=`剩 ${d} 天`;applyCdC='cd-urgent'}
      else if(d<=7){applyCdH=`剩 ${d} 天`;applyCdC='cd-soon'}
      else{applyCdH=`剩 ${d} 天`;applyCdC='cd-ok'}
      const applyPct=(t.registered||0)>0?Math.min(applied/t.registered,1):0;
      const applyBarC=applied>=(t.registered||0)&&(t.registered||0)>0?'var(--accent)':applyPct>=0.8?'var(--amber)':'var(--accent)';
      applyStatH=`<div class="cap"><div class="reg-row"><button class="reg-btn" onclick="event.stopPropagation();adjApplied('${t.id}',-1)" ${applied<=0?'disabled':''}>−</button><span class="cap-nums">${applied} / ${t.registered}</span><button class="reg-btn" onclick="event.stopPropagation();adjApplied('${t.id}',1)" ${applied>=(t.registered||0)?'disabled':''}>+</button></div><div class="cap-bar"><div class="cap-fill" style="width:${applyPct*100}%;background:${applyBarC}"></div></div></div>`;
    }

    let barC;if(isFull)barC='var(--red)';else if(pct>=0.8)barC='var(--amber)';else barC='var(--accent)';
    const curStatus=STATUS_OPTS.find(s=>s.key===t.status)||STATUS_OPTS[0];
    const statusH=`<span class="status-select-wrap"><select class="pill ${curStatus.cls}" onclick="event.stopPropagation()" onchange="event.stopPropagation();setStatus('${t.id}',this.value)">${STATUS_OPTS.map(s=>`<option value="${s.key}"${s.key===curStatus.key?' selected':''}>${s.label}</option>`).join('')}</select></span>`;

    const dateCol=fmtRange(t.date,t.dateEnd);
    const isOpen=expandedIds.has(t.id);
    const expandBtn=`<button class="act-btn expand${isOpen?' open':''}" onclick="toggleExpand('${t.id}')" title="更多資訊"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>`;
    const guideH=t.guide?esc(t.guide):'<span style="color:var(--text-muted)">—</span>';

    const mainRow=`<tr class="${isPast?'past':''}"><td>${statusH}</td><td>${flagsH}</td><td style="font-weight:600">${esc(t.name)}</td><td>${dateCol}</td><td>${applyDeadH}</td><td><span class="cd ${applyCdC}">${applyCdH}</span></td><td><div class="cap"><div class="reg-row"><button class="reg-btn" onclick="adjReg('${t.id}',-1)" ${t.registered<=0?'disabled':''}>−</button><span class="cap-nums ${isFull?'cap-full':pct>=0.8?'cap-high':''}">${t.registered} / ${t.capacity}</span><button class="reg-btn" onclick="adjReg('${t.id}',1)" ${isFull?'disabled':''}>+</button></div><div class="cap-bar"><div class="cap-fill" style="width:${pct*100}%;background:${barC}"></div></div></div></td><td>${applyStatH}</td><td>${guideH}</td><td><div class="acts">${expandBtn}<button class="act-btn" onclick="openEdit('${t.id}')" title="編輯"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button class="act-btn del" onclick="delTrip('${t.id}')" title="刪除"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></button></div></td></tr>`;

    let detailRow='';
    if(isOpen){
      const excelH=t.excelLink?`<a href="${escAttr(t.excelLink)}" target="_blank" rel="noopener">開啟連結 ↗</a>`:'<span>未設定</span>';
      detailRow=`<tr class="detail-row"><td></td><td class="dr-line"></td><td class="dr-body" colspan="${COLS.length-3}"><div class="detail-grid"><div class="detail-item"><b>報名截止日</b><span>${fmtDate(t.deadline)}</span></div><div class="detail-item"><b>Excel 名單連結</b>${excelH}</div><div class="detail-item"><b>備註</b><span>${t.notes?esc(t.notes):'—'}</span></div></div></td><td></td></tr>`;
    }
    return mainRow+detailRow;
  }).join('');
}

// ── Interactions ──
function setFilter(f){filter=f;render()}
function setSort(k){if(sortKey===k)sortDir=sortDir==='asc'?'desc':'asc';else{sortKey=k;sortDir=k==='promoted'?'desc':'asc'}render()}
async function toggleStar(id){if(!await ensureEditor())return;const t=trips.find(x=>x.id===id);if(!t)return;store.upd(id,{promoted:(t.promoted||0)>0?0:1})}
async function adjReg(id,delta){
  if(!await ensureEditor())return;
  const t=trips.find(x=>x.id===id);if(!t)return;
  const next=Math.max(0,(t.registered||0)+delta);
  if(t.capacity>0&&next>t.capacity)return;
  const patch={registered:next};
  if((t.applied||0)>next)patch.applied=next;
  store.upd(id,patch);
}
async function adjApplied(id,delta){if(!await ensureEditor())return;const t=trips.find(x=>x.id===id);if(!t)return;const max=t.registered||0;const next=Math.max(0,Math.min(max,(t.applied||0)+delta));store.upd(id,{applied:next})}
async function setStatus(id,val){if(!await ensureEditor()){render();return}store.upd(id,{status:val})}
function toggleExpand(id){if(expandedIds.has(id))expandedIds.delete(id);else expandedIds.add(id);render()}

async function openAdd(){if(!await ensureEditor())return;editId=null;document.getElementById('m-title').textContent='新增活動';document.getElementById('trip-form').reset();document.getElementById('f-reg').value='0';document.getElementById('f-status').value='reg';document.getElementById('deadline-hint').classList.remove('show');document.getElementById('apply-hint').classList.remove('show');showOv('ov-trip')}
async function openEdit(id){
  if(!await ensureEditor())return;
  const t=trips.find(x=>x.id===id);if(!t)return;editId=id;
  document.getElementById('m-title').textContent='編輯活動';
  document.getElementById('f-name').value=t.name;document.getElementById('f-date').value=t.date;
  document.getElementById('f-date-end').value=t.dateEnd||t.date;
  document.getElementById('f-dead').value=t.deadline;document.getElementById('f-reg').value=t.registered;
  document.getElementById('f-cap').value=t.capacity;document.getElementById('f-notes').value=t.notes||'';
  document.getElementById('f-guide').value=t.guide||'';document.getElementById('f-excel').value=t.excelLink||'';
  document.getElementById('f-status').value=t.status||'reg';
  document.getElementById('deadline-hint').classList.remove('show');document.getElementById('apply-hint').classList.remove('show');
  showOv('ov-trip');
}
function closeTrip(){hideOv('ov-trip')}
function saveTrip(e){
  e.preventDefault();
  const data={name:document.getElementById('f-name').value.trim(),date:document.getElementById('f-date').value,dateEnd:document.getElementById('f-date-end').value,deadline:document.getElementById('f-dead').value,registered:parseInt(document.getElementById('f-reg').value)||0,capacity:parseInt(document.getElementById('f-cap').value)||1,notes:document.getElementById('f-notes').value.trim(),guide:document.getElementById('f-guide').value.trim(),excelLink:document.getElementById('f-excel').value.trim(),status:document.getElementById('f-status').value};
  if(editId){store.upd(editId,data);toast('已更新')}else{data.id=genId();data.promoted=0;data.applied=0;data.createdAt=Date.now();store.add(data);toast('已新增')}
  closeTrip();
}
async function delTrip(id){if(!await ensureEditor())return;const t=trips.find(x=>x.id===id);if(!t)return;if(!confirm(`確定要刪除「${t.name}」嗎？`))return;store.del(id);toast('已刪除')}

document.getElementById('f-name').addEventListener('input',tryAutoFill);
document.getElementById('f-date').addEventListener('change',()=>{
  tryAutoFill();
  const dateEl=document.getElementById('f-date');const endEl=document.getElementById('f-date-end');
  if(dateEl.value&&(!endEl.value||endEl.value<dateEl.value))endEl.value=dateEl.value;
});

// ── LINE Report ──
function buildReport(){
  const now=new Date();const y=now.getFullYear(),mo=now.getMonth()+1,da=now.getDate(),dow=DAYS[now.getDay()];
  const future=trips.filter(t=>daysUntil(t.date)>=0).sort((a,b)=>a.date<b.date?-1:1);
  const promoted=future.filter(t=>t.promoted>0).sort((a,b)=>(b.promoted||0)-(a.promoted||0));
  let lines=[`📋 登山活動日報`,`━━━━━━━━━━━━`,`📅 ${y}年${mo}月${da}日（${dow}）`,''];
  if(promoted.length>0){
    lines.push('⭐ 重點宣傳','───────────');
    promoted.forEach(t=>{const cd=daysUntil(t.deadline);const cdTxt=cd<0?'已截止':cd===0?'今天截止':`剩${cd}天`;
      const dr=t.dateEnd&&t.dateEnd!==t.date?`${fmtShort(t.date)}~${fmtShort(t.dateEnd)}`:`${fmtShort(t.date)}（${DAYS[parseD(t.date).getDay()]}）`;
      lines.push(`🏔 ${t.name} ${'⭐'.repeat(t.promoted)}`);lines.push(`   日期：${dr}｜截止：${fmtShort(t.deadline)}（${cdTxt}）`);lines.push(`   報名：${t.registered} / ${t.capacity} 人`,'')});
  }
  lines.push('📊 全部活動','───────────');
  if(future.length===0)lines.push('（目前無活動）');
  else future.forEach(t=>{const cd=daysUntil(t.deadline);const cdTxt=cd<0?'已截止':cd===0?'今天截止':`剩${cd}天`;const isFull=t.capacity>0&&t.registered>=t.capacity;
    const dr=t.dateEnd&&t.dateEnd!==t.date?`${fmtShort(t.date)}~${fmtShort(t.dateEnd)}`:`${fmtShort(t.date)}`;
    lines.push(`🏔 ${t.name}${isFull?'【滿】':''}｜${dr}｜${t.registered}/${t.capacity}人｜截止${fmtShort(t.deadline)}（${cdTxt}）`)});
  const warnings=[];
  future.forEach(t=>{if(t.capacity>0&&t.registered>=t.capacity)return;if(t.capacity>0&&t.registered/t.capacity>=0.8)warnings.push(`❗ ${t.name} 即將額滿（剩${t.capacity-t.registered}名額）`);const cd=daysUntil(t.deadline);if(cd>=0&&cd<=3)warnings.push(`⏰ ${t.name} 報名即將截止（${cd===0?'今天':`剩${cd}天`}）`)});
  if(warnings.length>0){lines.push('','⚠️ 提醒','───────────');warnings.forEach(w=>lines.push(w))}
  const mktgItems=getMarketingItems();
  if(mktgItems.length>0){
    lines.push('','📣 本週行銷重點','───────────');
    mktgItems.forEach(it=>{
      let acts=[];
      if(it.inPromo)acts.push('宣傳中');
      if(it.noApply)acts.push('免申請');
      else if(it.applyDeadline){if(it.applyDaysLeft>=0&&it.applyDaysLeft<=7)acts.push(`需申請（剩${it.applyDaysLeft}天）`);else if(it.applyDaysLeft>=0)acts.push(`${fmtShort(dateStr(it.applyDeadline))}前申請`)}
      lines.push(`📢 ${it.trip.name}｜${fmtShort(it.trip.date)}出發｜${acts.join('，')}`);
    });
  }
  return lines.join('\n');
}
function showReport(){document.getElementById('rpt-text').textContent=buildReport();showOv('ov-rpt')}
function closeRpt(){hideOv('ov-rpt')}
async function copyReport(){const txt=buildReport();try{await navigator.clipboard.writeText(txt);toast('已複製到剪貼簿')}catch{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('已複製到剪貼簿')}}
async function downloadReport(){
  const txt=buildReport();
  const now=new Date();
  const fn=`登山日報_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.txt`;
  if(dlCap){try{await dlCap.save({filename:fn,data:txt});toast('已下載')}catch(e){if(e.code==='declined')return;toast('下載失敗')}return}
  try{
    const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('已下載');
  }catch{toast('下載失敗，請改用複製')}
}

function showOv(id){document.getElementById(id).classList.add('show')}
function hideOv(id){document.getElementById(id).classList.remove('show')}
document.querySelectorAll('.overlay').forEach(ov=>{ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('show')})});

let toastTimer;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('on'),2200)}

document.getElementById('login-pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin()});
let authed=false;try{authed=localStorage.getItem('hk-auth')==='1'}catch{}
if(authed)enterApp();
else{try{document.getElementById('login-pw').focus()}catch{}}
