<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>入野門會員中心</title>
<link rel="icon" type="image/png" href="favicon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --brand:#2e3c26;--brand-2:#3f5234;--gold:#dfac10;--gold-bg:#FBF3DA;
  --bg:#F2EEE5;--surface:#FFFFFF;--text:#253D33;--text-2:#4E6358;--text-muted:#8A9990;
  --border-sub:#E2DED5;--accent:#3D8B66;--red:#C24740;
  --shadow:0 1px 4px rgba(37,61,51,.09);--r:10px;
  --font:'PingFang TC','Microsoft JhengHei','Noto Sans TC',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:0 16px 40px}
.hero{background:var(--brand);color:#F3EFE6;padding:28px 16px 64px;text-align:center}
.hero-brand{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;letter-spacing:.08em;font-size:14px;opacity:.9}
.hero-brand img{width:26px;height:26px;border-radius:50%}
.card{background:var(--surface);border:1px solid var(--border-sub);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.profile{margin-top:-44px;display:flex;align-items:center;gap:14px}
.avatar{width:60px;height:60px;border-radius:50%;object-fit:cover;background:var(--bg);flex-shrink:0;border:2px solid var(--surface)}
.p-name{font-size:18px;font-weight:700}
.tier{display:inline-block;margin-top:4px;padding:2px 10px;border-radius:12px;background:var(--gold-bg);color:#8A6A08;font-size:12px;font-weight:700}
.bal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.balance{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#F3EFE6;border:none}
.bal-label{font-size:13px;opacity:.8}
.balance.rebate{background:linear-gradient(135deg,#6b5310,#9a7a16)}
.bal-val{font-size:28px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.bal-val small{font-size:16px;font-weight:600;margin-right:4px;color:var(--gold)}
.tabs{display:flex;gap:6px;margin:22px 0 10px}
.tabs button{flex:1;padding:9px 4px;border-radius:8px;border:1px solid var(--border-sub);background:var(--surface);font:600 14px var(--font);color:var(--text-muted);cursor:pointer}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#F3EFE6}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px}
.item-main{min-width:0}
.item-title{font-weight:700;font-size:15px}
.item-sub{font-size:13px;color:var(--text-muted);margin-top:2px}
.item-amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--accent)}.neg{color:var(--red)}
.tag-x{background:#FDECEA!important;color:#C24740!important}
.dim{opacity:.6}
.exp{font-size:12px;color:var(--accent);margin-top:6px;font-weight:600}
.exp.soon{color:#B7791F}
.exp.out{color:var(--red)}
.tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;vertical-align:2px;background:var(--gold-bg);color:#8A6A08}
.empty{text-align:center;color:var(--text-muted);font-size:14px;padding:32px 0}
.center{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.center img{width:72px;height:72px;border-radius:50%}
.center h1{font-size:20px}
.center p{color:var(--text-muted);font-size:14px}
.g-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:11px 24px;border-radius:8px;border:1px solid #DADCE0;background:#fff;color:#3C4043;font:600 15px var(--font);cursor:pointer;text-decoration:none}
.g-btn svg{width:18px;height:18px}
.g-btn:active{background:#F1F3F4}
.p-btn{display:inline-flex;padding:11px 24px;border-radius:8px;border:none;background:var(--brand);color:#F3EFE6;font:600 15px var(--font);cursor:pointer}
.p-email{font-size:12px;color:var(--text-muted);margin-top:2px;word-break:break-all}
.hint{font-size:13px;color:var(--text-muted);line-height:1.7;max-width:300px}
.foot{text-align:center;margin-top:24px}
.foot button{background:none;border:none;color:var(--text-muted);font:13px var(--font);text-decoration:underline;cursor:pointer}
.spin{width:28px;height:28px;border:3px solid var(--border-sub);border-top-color:var(--brand);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spin"></div></div></div>

<script>
// ── 設定 ──
const SB_URL='https://dygxochowbhmdftstgoz.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR5Z3hvY2hvd2JobWRmdHN0Z296Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzMzc4MjcsImV4cCI6MjEwMzkxMzgyN30.EVgYdDb4lxsj3Rb40uCZHt2x_6tyexGuVTVywjj2fHQ';
const API=SB_URL+'/functions/v1/member-api';
// 用獨立的 storageKey，避免會員登入狀態被同網域的後台 index.html 讀到
const sb=window.supabase?window.supabase.createClient(SB_URL,SB_KEY,{auth:{storageKey:'hk-member-auth',flowType:'pkce',detectSessionInUrl:true,persistSession:true}}):null;
const G_ICON='<svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>';

const DAYS=['日','一','二','三','四','五','六'];
const app=document.getElementById('app');
let data=null,tab='trips';

function esc(s){const d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function money(n){return Number(n).toLocaleString('zh-TW')}
const TXN_LABEL={topup:'儲值',spend:'扣款',grant:'回饋金發放',deduct:'回饋金使用',reversal:'更正'};
function parseD(s){return new Date(s+'T00:00:00')}
function fmtD(s){const d=parseD(s);return`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${DAYS[d.getDay()]}）`}
function fmtRange(s,e){
  if(!s)return'';
  if(!e||e===s)return fmtD(s);
  const de=parseD(e);
  return`${fmtD(s)} ~ ${de.getMonth()+1}/${de.getDate()}（${DAYS[de.getDay()]}）`;
}
function todayStr(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function showMsg(title,msg,btn){
  app.innerHTML=`<div class="center"><img src="favicon.png" alt=""><h1>${esc(title)}</h1><p>${esc(msg)}</p>${btn||''}</div>`;
}
const RELOAD_BTN='<button class="p-btn" onclick="location.reload()">重新整理</button>';
function pageUrl(){return location.origin+location.pathname}
function showLogin(){
  showMsg('入野門會員中心','用 Google 帳號登入，查看儲值金與參加過的行程',
    `<button class="g-btn" onclick="login()">${G_ICON}使用 Google 登入</button>`);
}
async function login(){
  const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:pageUrl(),queryParams:{prompt:'select_account'}}});
  if(error)showMsg('登入失敗',error.message,RELOAD_BTN);
}
async function logout(){await sb.auth.signOut();showLogin()}

// Google 不允許在 App 內建瀏覽器（LINE、FB、IG）登入，要請會員改用 Safari / Chrome
function inAppBrowser(){const ua=navigator.userAgent;return/Line\/|FBAN|FBAV|Instagram/i.test(ua)?(/Line\//i.test(ua)?'line':'other'):''}
function showInAppHint(){
  const url=pageUrl();
  showMsg('請用瀏覽器開啟','Google 登入不支援在 App 內開啟，請點右上角選單，選「用瀏覽器開啟」',
    `<button class="p-btn" onclick="copyUrl()">複製網址</button><div class="hint" id="copy-hint">${esc(url)}</div>`);
}
function copyUrl(){
  const url=pageUrl();
  (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(
    ()=>{document.getElementById('copy-hint').textContent='已複製，請貼到 Safari 或 Chrome'},
    ()=>{document.getElementById('copy-hint').textContent=url});
}

async function load(session){
  let res,body;
  try{
    res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({action:'me'})});
    body=await res.json();
  }catch(e){showMsg('連線失敗','請檢查網路後重新整理',RELOAD_BTN);return}
  if(res.status===401){await sb.auth.signOut();showLogin();return}
  if(!res.ok){showMsg('讀取失敗',body.error||'請稍後再試',RELOAD_BTN);return}
  data=body;render();
}

function setTab(t){tab=t;render()}

function render(){
  const{member:m,balances,ledger,trips}=data;
  const today=todayStr();
  const tripItems=trips.map(t=>{
    const cancelled=t.status==='cancelled';
    const upcoming=!cancelled&&t.trip_date&&(t.trip_date_end||t.trip_date)>=today;
    return`<div class="card item ${cancelled?'dim':''}"><div class="item-main">
      <div class="item-title">${esc(t.trip_name)}${upcoming?'<span class="tag">即將出發</span>':''}${cancelled?'<span class="tag tag-x">已取消</span>':''}</div>
      <div class="item-sub">${esc(fmtRange(t.trip_date,t.trip_date_end))}${t.note?'　'+esc(t.note):''}</div>
    </div>${t.price!=null?`<div class="item-amt">$${money(t.price)}</div>`:''}</div>`;
  }).join('');
  const ledgerItems=acc=>ledger.filter(l=>l.account===acc).map(l=>`<div class="card item"><div class="item-main">
      <div class="item-title">${esc(l.note||TXN_LABEL[l.txn_type])}</div>
      <div class="item-sub">${esc(fmtD(l.txn_date))}・餘額 $${money(l.balance_after)}</div>
    </div><div class="item-amt ${l.amount>0?'pos':'neg'}">${l.amount>0?'+':'−'}$${money(Math.abs(l.amount))}</div></div>`).join('');
  let exp='';
  if(m.expires_at){
    const left=Math.ceil((parseD(m.expires_at)-parseD(today))/864e5);
    exp=left<0?`<div class="exp out">會員已於 ${esc(fmtD(m.expires_at))} 到期</div>`
      :`<div class="exp ${left<=30?'soon':''}">會員有效至 ${esc(fmtD(m.expires_at))}${left<=30?`（剩 ${left} 天）`:''}</div>`;
  }
  const lists={trips:tripItems||'<div class="empty">還沒有行程紀錄</div>',
    stored:ledgerItems('stored')||'<div class="empty">還沒有儲值金紀錄</div>',
    rebate:ledgerItems('rebate')||'<div class="empty">還沒有回饋金紀錄</div>'};

  app.innerHTML=`
    <div class="hero"><div class="hero-brand"><img src="favicon.png" alt="">入野門 WILDGATE</div></div>
    <div class="wrap">
      <div class="card profile">
        ${m.google_picture?`<img class="avatar" src="${esc(m.google_picture)}" alt="" referrerpolicy="no-referrer">`:'<div class="avatar"></div>'}
        <div style="min-width:0"><div class="p-name">${esc(m.real_name||m.google_name||'會員')}</div><div class="p-email">${esc(m.email)}</div><span class="tier">${esc(m.tier)}</span>${exp}</div>
      </div>
      <div class="bal-grid">
        <div class="card balance"><div class="bal-label">儲值金餘額</div><div class="bal-val"><small>NT$</small>${money(balances.stored)}</div></div>
        <div class="card balance rebate"><div class="bal-label">入野門回饋金</div><div class="bal-val"><small>NT$</small>${money(balances.rebate)}</div></div>
      </div>
      <div class="tabs">
        <button class="${tab==='trips'?'on':''}" onclick="setTab('trips')">我的行程（${trips.filter(t=>t.status!=='cancelled').length}）</button>
        <button class="${tab==='stored'?'on':''}" onclick="setTab('stored')">儲值金紀錄</button>
        <button class="${tab==='rebate'?'on':''}" onclick="setTab('rebate')">回饋金紀錄</button>
      </div>
      <div class="list">${lists[tab]}</div>
      <div class="foot"><button onclick="logout()">登出</button></div>
    </div>`;
}

(async()=>{
  // LINE 支援加 openExternalBrowser=1 直接跳到外部瀏覽器；其他 App 只能請會員自己切換
  const iab=inAppBrowser();
  if(iab==='line'&&!new URLSearchParams(location.search).has('openExternalBrowser')){location.replace(pageUrl()+'?openExternalBrowser=1');return}
  if(iab){showInAppHint();return}
  if(!sb){showMsg('載入失敗','登入元件無法載入，請重新整理',RELOAD_BTN);return}
  // Google 登入回來時網址帶 ?code=...，getSession 會自動換成登入狀態
  const{data:{session},error}=await sb.auth.getSession();
  if(location.search.includes('code='))history.replaceState(null,'',pageUrl());
  if(error){showMsg('登入失敗',error.message,`<button class="g-btn" onclick="login()">${G_ICON}重新登入</button>`);return}
  if(!session){showLogin();return}
  load(session);
})();
</script>
</body>
</html>
